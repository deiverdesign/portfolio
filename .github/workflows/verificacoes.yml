# Verificações que rodam ANTES do merge, em todo Pull Request.
#
# Diferente do deploy-storybook.yml, que roda DEPOIS (on: push no main
# publica o Storybook). Este aqui existe pra barrar, não pra publicar.

name: Verificações

on:
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Cada verificação é um passo separado de propósito: assim o GitHub
      # mostra qual falhou, em vez de um bloco só vermelho.

      - name: Tokens de tipografia
        run: npm run check-tokens

      - name: Typecheck
        if: always()
        run: npx tsc --noEmit

      - name: Lint
        if: always()
        run: npm run lint

      - name: Build
        if: always()
        run: npm run build
